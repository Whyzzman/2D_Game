<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Вороги — кадри</title>
<style>
  html, body { margin: 0; background: transparent; }
  body.sheet { background: #4a5266; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="out"></canvas>
<script src="../_shared/paint.js"></script>
<script src="../_shared/mesh.js"></script>
<script src="enemies.js"></script>
<script src="enemies-forest.js"></script>
<script src="enemies-vc.js"></script>
<script src="enemies-marsh.js"></script>
<script>
// ?actor=ZombieSoldier&state=Idle&frames=6 — кадри стану в ряд (прозорий фон), для нарізки
// ?sheet=1&actor=ZombieSoldier&states=Idle:6,AttackLight:18 — перегляд
(async function () {
  const q = new URLSearchParams(location.search);
  if (q.get("flat") !== "1") await Enemies.loadPuppet(q.get("actor"), `parts/${q.get("actor")}/`);
  const actor = Enemies.ACTORS[q.get("actor")];
  const canvas = document.getElementById("out"), g = canvas.getContext("2d");
  const frame = document.createElement("canvas"); frame.width = actor.w; frame.height = actor.h;
  const fg = Paint.wrap(frame.getContext("2d"));
  if (q.get("sheet")) {
    document.body.classList.add("sheet");
    const list = q.get("states").split(","), scale = parseFloat(q.get("scale") || "0.8"), cols = parseInt(q.get("cols") || "10", 10);
    let rows = 0;
    const plan = list.map(item => { const [name, n] = item.split(":"); const k = parseInt(n, 10); const every = Math.max(1, Math.ceil(k / cols)); const shown = []; for (let i = 0; i < k; i += every) shown.push(i); rows++; return { name, k, shown }; });
    canvas.width = cols * actor.w * scale; canvas.height = rows * actor.h * scale;
    plan.forEach((row, r) => {
      const poses = actor.states[row.name](row.k);
      row.shown.forEach((i, c) => { Enemies.render(fg, actor, poses[i], i); g.drawImage(frame, c * actor.w * scale, r * actor.h * scale, actor.w * scale, actor.h * scale); });
    });
  } else {
    // &px=…&pt=…&cols=… — кадр із запасом px з боків і pt згори, стопи на тому самому місці (низ, середина), кадри
    // сіткою по cols: дуга удару чи ривок, що виходять за кадр, не зрізаються прямою лінією; tools/enemies/split.py
    // потім обрізає запас до намальованого (2026-11-06, вирішено Claude за постійною згодою)
    const n = parseInt(q.get("frames"), 10), poses = actor.states[q.get("state")](n);
    const px = parseInt(q.get("px") || "0", 10), pt = parseInt(q.get("pt") || "0", 10);
    const cols = Math.min(n, parseInt(q.get("cols") || String(n), 10));
    const W = actor.w + 2 * px, H = actor.h + pt;
    frame.width = W; frame.height = H;
    canvas.width = W * cols; canvas.height = H * Math.ceil(n / cols);
    poses.forEach((p, i) => {
      fg.save(); fg.setTransform(1, 0, 0, 1, 0, 0); fg.clearRect(0, 0, W, H); fg.translate(px, pt);
      Enemies.render(fg, actor, p, i);
      fg.restore();
      g.drawImage(frame, (i % cols) * W, Math.floor(i / cols) * H);
    });
  }
  document.title = "done";
})();
</script>
</body>
</html>
