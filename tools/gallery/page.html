<title>Кімнати п'яти зон</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral+SC:wght@500;600&family=Spectral:ital,wght@0,400;1,400&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: a night archive of the levels — zone by zone, a contact sheet of rooms, one picture opened large.
   A deliberately dark single look, like the game it shows. */
:root {
  --ground: #0d0b0a;
  --panel: #171412;
  --ink: #ece2d0;
  --ink-dim: #9a8e7c;
  --edge: #2d2620;
  --gold: #d8b46a;
  --display: "Spectral SC", "Cormorant SC", Georgia, serif;
  --body: "Spectral", Georgia, "Times New Roman", serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html { background: var(--ground); }
body { background: var(--ground); color: var(--ink); font: 16px/1.5 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ground); }
.wrap { max-width: 1480px; margin: 0 auto; padding-block: 40px 80px; }
header { display: grid; gap: 10px; margin-bottom: 26px; }
.eyebrow { font: 12px var(--mono); letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-dim); margin: 0; }
h1 { font: 600 clamp(32px, 5vw, 54px)/1.05 var(--display); margin: 0; letter-spacing: 0.02em; text-wrap: balance; }
.lead { max-width: 64ch; color: var(--ink-dim); margin: 0; }
.lead b { color: var(--gold); font-weight: 400; }
nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; flex-wrap: wrap; gap: 8px;
  padding: 12px 0; background: var(--ground); border-bottom: 1px solid var(--edge); margin-bottom: 8px; }
nav a { color: var(--ink); text-decoration: none; font: 500 15px var(--display); letter-spacing: 0.04em;
  padding: 6px 12px; border: 1px solid var(--edge); border-left: 3px solid var(--zone); background: var(--panel); }
nav a b { font: 12px var(--mono); color: var(--ink-dim); font-weight: 400; margin-left: 6px; }
nav a:hover, nav a:focus-visible { border-color: var(--zone); outline: none; }
.zone { padding-top: 34px; scroll-margin-top: 64px; }
.zone h2 { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin: 0 0 16px;
  font: 600 clamp(24px, 3vw, 32px)/1.1 var(--display); color: var(--zone); letter-spacing: 0.03em; }
.zone h2 small { font: 12px var(--mono); color: var(--ink-dim); letter-spacing: 0.1em; text-transform: uppercase; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 14px; }
.room { margin: 0; background: var(--panel); border: 1px solid var(--edge); cursor: zoom-in; min-width: 0; }
.room:hover, .room:focus-visible { border-color: var(--zone); outline: none; }
.room img { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: cover; background: #000; max-width: 100%; }
.room figcaption { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; padding: 9px 12px 11px; align-items: baseline; }
.num { font: 600 15px var(--display); color: var(--zone); font-variant-numeric: tabular-nums; grid-row: span 2; }
.name { font-size: 15px; min-width: 0; }
.room code { font: 11px var(--mono); color: var(--ink-dim); overflow-wrap: anywhere; }
.box { position: fixed; inset: 0; z-index: 20; background: rgba(5, 4, 3, 0.94); display: grid;
  grid-template-rows: 1fr auto; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.box img { width: 100%; height: 100%; object-fit: contain; min-height: 0; max-width: 100%; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 12px; }
.bar p { margin: 0; font: 500 18px var(--display); letter-spacing: 0.03em; }
.bar p code { font: 12px var(--mono); color: var(--ink-dim); margin-left: 10px; }
.bar div { display: flex; gap: 8px; }
.bar button { font: 500 14px var(--display); color: var(--ink); background: var(--panel); border: 1px solid var(--edge);
  padding: 8px 14px; cursor: pointer; letter-spacing: 0.04em; }
.bar button:hover, .bar button:focus-visible { border-color: var(--gold); outline: none; }
@media (prefers-reduced-motion: no-preference) { .room { transition: border-color 0.15s; } }
</style>

<div class="wrap">
  <header>
    <p class="eyebrow">Тінь Забутого Королівства · знімки з гри</p>
    <h1>Кімнати п'яти зон</h1>
    <p class="lead">Усі <b>{{TOTAL}}</b> кімнат, як їх бачить камера, коли герой стоїть посередині. Для правки назвіть
      зону й номер — наприклад, «Ліс 12: фон заяскравий». Клік відкриває кімнату на весь екран, стрілки гортають.</p>
  </header>
  <nav aria-label="Зони">{{NAV}}</nav>
  {{SECTIONS}}
</div>

<div class="box" id="box" hidden>
  <img id="box-img" alt="">
  <div class="bar">
    <p id="box-label"></p>
    <div>
      <button type="button" id="prev">← Попередня</button>
      <button type="button" id="next">Наступна →</button>
      <button type="button" id="close">Закрити</button>
    </div>
  </div>
</div>

<script>
(function () {
  var rooms = Array.prototype.slice.call(document.querySelectorAll(".room"));
  var box = document.getElementById("box"), img = document.getElementById("box-img"), label = document.getElementById("box-label");
  var at = -1;
  function show(i) {
    at = (i + rooms.length) % rooms.length;
    var room = rooms[at];
    img.src = room.dataset.src;
    img.alt = room.dataset.label;
    label.textContent = room.dataset.label;
    var id = document.createElement("code");
    id.textContent = room.dataset.id;
    label.appendChild(id);
    box.hidden = false;
  }
  function hide() { box.hidden = true; if (rooms[at]) rooms[at].focus(); }
  rooms.forEach(function (room, i) {
    room.addEventListener("click", function () { show(i); });
    room.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); show(i); } });
  });
  document.getElementById("prev").addEventListener("click", function () { show(at - 1); });
  document.getElementById("next").addEventListener("click", function () { show(at + 1); });
  document.getElementById("close").addEventListener("click", hide);
  box.addEventListener("click", function (e) { if (e.target === box || e.target === img) hide(); });
  document.addEventListener("keydown", function (e) {
    if (box.hidden) return;
    if (e.key === "Escape") hide();
    else if (e.key === "ArrowLeft") show(at - 1);
    else if (e.key === "ArrowRight") show(at + 1);
  });
})();
</script>
